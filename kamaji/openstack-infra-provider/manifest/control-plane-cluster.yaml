apiVersion: cluster.x-k8s.io/v1beta1
kind: Cluster
metadata:
  name: kamaji-cp
  namespace: kamaji-system
  labels:
    addons.cluster.x-k8s.io/ccm: "true"
    addons.cluster.x-k8s.io/cilium: "true"
    addons.cluster.x-k8s.io/cinder-csi: "true"
    addons.cluster.x-k8s.io/cert-manager: "true"
    addons.cluster.x-k8s.io/kamaji: "true"
spec:
  clusterNetwork:
    services:
      cidrBlocks:
      - 10.96.0.0/12
    pods:
      cidrBlocks:
      - 10.244.0.0/16
    serviceDomain: cluster.local
  controlPlaneRef:
    apiVersion: controlplane.cluster.x-k8s.io/v1beta1
    kind: KubeadmControlPlane
    name: kamaji-cp-control-plane
    namespace: kamaji-system
  infrastructureRef:
    apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
    kind: OpenStackCluster
    name: kamaji-cp
    namespace: kamaji-system
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: OpenStackCluster
metadata:
  name: kamaji-cp
  namespace: kamaji-system
spec:
  apiServerLoadBalancer:
    enabled: true
  externalNetwork:
    id: ce4fe159-252e-4f1d-a81a-87653063f922
  identityRef:
    cloudName: openstack-stage
    name: kamaji-cp
  managedSecurityGroups:
    allowAllInClusterTraffic: true
  managedSubnets:
  - cidr: 10.0.0.0/24
    dnsNameservers: [172.16.131.11 ,172.16.131.12, 172.16.140.2]
---
apiVersion: controlplane.cluster.x-k8s.io/v1beta1
kind: KubeadmControlPlane
metadata:
  name: kamaji-cp-control-plane
  namespace: kamaji-system
spec:
  replicas: 1
  version: v1.36.1
  machineTemplate:
    infrastructureRef:
      apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
      kind: OpenStackMachineTemplate
      name: kamaji-cp-control-plane
      namespace: kamaji-system
  kubeadmConfigSpec:
    format: cloud-config
    files:
    - path: /etc/kubernetes/cloud.conf
      owner: root:root
      permissions: "0600"
      encoding: base64
      content: 
    clusterConfiguration:
      apiServer:
        extraArgs: {}
          # cloud-provider: external
      controllerManager:
        extraArgs:
          cloud-provider: external
    initConfiguration:
      nodeRegistration:
        kubeletExtraArgs:
          cloud-provider: external
        name: '{{ local_hostname }}'
    joinConfiguration:
      nodeRegistration:
        kubeletExtraArgs:
          cloud-provider: external
        name: '{{ local_hostname }}'
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: OpenStackMachineTemplate
metadata:
  name: kamaji-cp-control-plane
  namespace: kamaji-system
spec:
  template:
    spec:
      flavor: g1.xlarge
      image:
        filter:
          name: ubuntu-26.04-kube-v1.36.1
      sshKeyName: compute-team
      rootVolume:
        sizeGiB: 30
        type: RBD_SSD
---
apiVersion: bootstrap.cluster.x-k8s.io/v1beta1
kind: KubeadmConfigTemplate
metadata:
  name: kamaji-cp-bootstrap
  namespace: kamaji-system
spec:
  template:
    spec:
      format: cloud-config
      files:
      - path: /etc/kubernetes/cloud.conf
        owner: root:root
        permissions: "0600"
        encoding: base64
        content: 
      joinConfiguration:
        nodeRegistration:
          imagePullPolicy: IfNotPresent
          kubeletExtraArgs:
            cloud-provider: external
          name: '{{ local_hostname }}'
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: OpenStackMachineTemplate
metadata:
  name: kamaji-cp-worker
  namespace: kamaji-system
spec:
  template:
    spec:
      flavor: g1.xlarge
      image:
        filter:
          name: ubuntu-26.04-kube-v1.36.1
      sshKeyName: compute-team
---
apiVersion: cluster.x-k8s.io/v1beta1
kind: MachineDeployment
metadata:
  name: kamaji-cp-md-0
  namespace: kamaji-system
spec:
  clusterName: kamaji-cp
  replicas: 1
  selector:
    matchLabels:
      nodepool: worker
  template:
    metadata:
      labels:
        nodepool: worker
    spec:
      clusterName: kamaji-cp
      version: v1.36.1
      bootstrap:
        configRef:
          apiVersion: bootstrap.cluster.x-k8s.io/v1beta1
          kind: KubeadmConfigTemplate
          name: kamaji-cp-bootstrap
          namespace: kamaji-system
      infrastructureRef:
        apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
        kind: OpenStackMachineTemplate
        name: kamaji-cp-worker
        namespace: kamaji-system
